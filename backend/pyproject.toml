[project]
name = "discovery_ai"
version = "0.1.0"
description = "discovery_ai using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[file-processing,litellm,tools]==1.14.4",
    "fastapi",
    "jambo",
    "uvicorn",
]

[project.scripts]
discovery_ai = "discovery_ai.main:run"
run_crew = "discovery_ai.main:run"
train = "discovery_ai.main:train"
replay = "discovery_ai.main:replay"
serve_api = "discovery_ai.api:serve_api"
test = "discovery_ai.main:test"
run_with_trigger = "discovery_ai.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]
