[project]
name = "discovery_ai_platform___complete_product_discovery_workflow"
version = "0.1.0"
description = "discovery_ai_platform___complete_product_discovery_workflow using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[file-processing,litellm,tools]==1.14.4",
    "firecrawl-py",
    "jambo",
]

[project.scripts]
discovery_ai_platform___complete_product_discovery_workflow = "discovery_ai_platform___complete_product_discovery_workflow.main:run"
run_crew = "discovery_ai_platform___complete_product_discovery_workflow.main:run"
train = "discovery_ai_platform___complete_product_discovery_workflow.main:train"
replay = "discovery_ai_platform___complete_product_discovery_workflow.main:replay"
test = "discovery_ai_platform___complete_product_discovery_workflow.main:test"
run_with_trigger = "discovery_ai_platform___complete_product_discovery_workflow.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]
